name: docs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-change:
    name: Detect release merge
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
    steps:
      - uses: compas-dev/compas-actions/release-check@v1
        id: release

  build:
    needs: release-change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/docs@v1
        with:
          extras: dev

  deploy:
    # Release merges are deployed by the release workflow, under their version.
    needs: release-change
    if: github.event_name == 'push' && needs.release-change.outputs.is-release != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/docs@v1
        with:
          deploy: true
          extras: dev
