name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Detect release merge
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: compas-dev/compas-actions/release-check@v1
        id: release

  build:
    needs: release
    if: needs.release.outputs.is-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: compas-dev/compas-actions/ci@v1
        with:
          python-version: ${{ matrix.python }}
          invoke-tasks: lint test

  prepare:
    needs: [release, build]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/prepare-release@v1
        with:
          python-version: "3.12"

  publish:
    needs: [release, prepare]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/compas_rrc
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  create-release:
    needs: [release, publish]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/github-release@v1
        with:
          github-token: ${{ github.token }}
          tag-name: ${{ needs.release.outputs.tag }}
          target: ${{ github.sha }}
          release-name-prefix: COMPAS RRC

  docs:
    needs: [release, create-release]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/docs@v1
        with:
          deploy: true
          version: ${{ needs.release.outputs.version }}
          extras: dev
